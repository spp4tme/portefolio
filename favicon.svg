<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141929"/>
      <stop offset="100%" stop-color="#090c12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Border subtil -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5" fill="none" stroke="#4b8eff" stroke-width="0.6" opacity="0.25"/>

  <!-- Accent coin haut-gauche -->
  <path d="M1 8 L1 2 Q1 1 2 1 L8 1" stroke="#4b8eff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Accent coin bas-droit -->
  <path d="M31 24 L31 30 Q31 31 30 31 L24 31" stroke="#4b8eff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- > chevron avec glow -->
  <path d="M6 10 L13.5 16 L6 22" stroke="#4b8eff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- _ curseur avec glow -->
  <rect x="16.5" y="20.5" width="10" height="2.4" rx="1.2" fill="#4b8eff" filter="url(#glow)"/>
</svg>
